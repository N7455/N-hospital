
name: n_hospital
description: "N Hospital Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/n_hospital_icon.png"
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: "assets/n_hospital_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
